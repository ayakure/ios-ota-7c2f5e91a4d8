<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Instagram Regram 설치</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f4f4f7;
      color: #111;
    }
    main {
      width: min(88vw, 420px);
      padding: 32px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 16px 48px rgb(0 0 0 / 10%);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 25px; }
    p { margin: 8px 0 24px; color: #666; line-height: 1.55; }
    a {
      display: block;
      padding: 15px 20px;
      border-radius: 14px;
      background: #0878ff;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    small { display: block; margin-top: 18px; color: #888; }
    @media (prefers-color-scheme: dark) {
      body { background: #111114; color: #f5f5f7; }
      main { background: #1c1c1e; box-shadow: none; }
      p, small { color: #aaa; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Instagram Regram</h1>
    <p>등록된 iPhone에서 설치하거나 기존 앱을 업데이트합니다.</p>
    <a id="install" href="itms-services://?action=download-manifest&amp;url=https%3A%2F%2Fayakure.github.io%2Fios-ota-7c2f5e91a4d8%2Fmanifest.plist">설치 / 업데이트</a>
    <small>443.0.0 · Regram 6.0 · Build 1043399932</small>
  </main>
  <script>
    const installURL = document.getElementById("install").href;
    if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      window.setTimeout(() => window.location.assign(installURL), 350);
    }
  </script>
</body>
</html>
